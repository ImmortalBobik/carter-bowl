<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carter Bowl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D lane in pale birch; a floating frosted scorecard on top, one quiet hint at the bottom. */
:root{
  --bg:#eef0f3;
  --ink:#1b2130;
  --muted:#7b8394;
  --line:#dde1e7;
  --card:rgba(255,255,255,.84);
  --accent:#2d52f5;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}

.hud{position:fixed;left:0;right:0;top:0;z-index:2;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:760px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 55%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--line);flex:none}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1}
.brand .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.total{margin-left:auto;text-align:right}
.total b{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;display:block;line-height:1}
.total span{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.card{background:var(--card);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;pointer-events:auto;overflow-x:auto;max-width:100%}
.sheet{display:grid;grid-template-columns:repeat(9,minmax(38px,1fr)) minmax(56px,1.45fr);min-width:430px}
.fr{border-left:1px solid var(--line);display:flex;flex-direction:column;font-family:var(--mono);font-variant-numeric:tabular-nums;position:relative}
.fr:first-child{border-left:0}
.fr .n{font-size:9.5px;color:var(--muted);padding:4px 6px 0;letter-spacing:.06em}
.fr .rolls{display:flex;justify-content:flex-end;font-size:12px;height:18px}
.fr .rolls i{font-style:normal;width:17px;text-align:center;line-height:18px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.fr .rolls i.x{color:var(--accent);font-weight:600}
.fr .cum{font-size:15px;font-weight:600;text-align:center;padding:3px 0 6px;min-height:20px}
.fr.now::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:2px;border-radius:2px;background:var(--accent)}

.hint{position:fixed;z-index:2;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.hint b{color:var(--ink);font-weight:600}
.hint.off{opacity:0}

.toast{position:fixed;z-index:3;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .25s, transform .35s cubic-bezier(.2,1.4,.4,1)}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 55%;box-shadow:0 0 0 3px #fff,0 8px 24px rgba(27,33,48,.18)}
.toast span{font-size:clamp(40px,11vw,76px);font-weight:800;letter-spacing:-.045em;line-height:.9;color:var(--ink)}
.toast span em{font-style:normal;color:var(--accent)}

.over{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:rgba(238,240,243,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 28px 24px;width:min(340px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 20px 60px rgba(27,33,48,.12)}
.panel img{width:88px;height:88px;border-radius:50%;object-fit:cover;object-position:50% 55%;margin-bottom:8px}
.panel .lbl{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.panel .big{font-family:var(--mono);font-size:64px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.panel .best{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:14px}
.panel p{margin:0 0 10px;font-size:15px;text-wrap:balance}
button{font:inherit;font-weight:800;font-size:16px;letter-spacing:-.01em;border:0;border-radius:999px;padding:12px 26px;background:var(--ink);color:#fff;cursor:pointer}
button:hover{background:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.toast{transition:opacity .2s}}
</style>

<div id="stage" aria-label="Bowling lane. Drag sideways to aim, flick up to bowl. Arrow keys and space also work."></div>

<div class="hud">
  <div class="brand">
    <img class="avatar" id="av" alt="Carter">
    <div>
      <h1>Carter Bowl</h1>
      <div class="sub" id="status">Frame 1 · Ball 1</div>
    </div>
    <div class="total"><b id="total">0</b><span>Score</span></div>
  </div>
  <div class="card"><div class="sheet" id="sheet"></div></div>
</div>

<div class="hint" id="hint"><b>Drag</b> sideways to line up · <b>flick up</b> to bowl</div>
<div class="toast" id="toast"><img id="toastImg" alt=""><span id="toastText">Strike</span></div>

<div class="over" id="over" hidden>
  <div class="panel">
    <img id="overImg" alt="Carter">
    <div class="lbl">Final score</div>
    <div class="big" id="final">0</div>
    <div class="best" id="best">Best 0</div>
    <p id="verdict">Carter is proud of you.</p>
    <button id="again" type="button">Bowl again</button>
  </div>
</div>

function collide(a, b, ra, rb, ma, mb, e) {

  const nx = dx / d, nz = dz / d;
  const over = min - d, wa = mb / (ma + mb), wb = ma / (ma + mb);
  a.x -= nx * over * wa; a.z -= nz * over * wa; b.x += nx * over * wb; b.z += nz * over * wb;
  const rel = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
  if (rel >= 0) return 0;
  const j = -(1 + e) * rel / (1 / ma + 1 / mb);
  a.vx -= j / ma * nx; a.vz -= j / ma * nz; b.vx += j / mb * nx; b.vz += j / mb * nz;
  return -rel;
}
const pinR = p => PR + (p.standing ? 0 : 0.07 * Math.sin(p.tilt));

function knock(p) {

  p.standing = false;

  p.dx = p.vx / s + (Math.random() - 0.5) * 0.4; p.dz = p.vz / s;
  const n = Math.hypot(p.dx, p.dz); p.dx /= n; p.dz /= n;

}

function step(dt) {

    ball.vx *= 1 - 0.05 * dt; ball.vz *= 1 - 0.03 * dt;
    ball.x += ball.vx * dt; ball.z += ball.vz * dt;
    if (!ball.gutter && Math.abs(ball.x) > W / 2) { ball.gutter = true; ball.x = Math.sign(ball.x) * (W / 2 + 0.1); ball.vx = 0; ball.y = BR - 0.075; }
    if (ball.z < PIT) { ball.rolling = false; ball.gone = true; }
    const sp = Math.hypot(ball.vx, ball.vz);
    if (sp > 0) { axis.set(ball.vz / sp, 0, -ball.vx / sp); q.setFromAxisAngle(axis, sp * dt / BR); ballMesh.quaternion.premultiply(q); }
  }
  for (const p of pins) {
    if (!p.active || p.dropped) continue;
    p.x += p.vx * dt; p.z += p.vz * dt;
    const sp = Math.hypot(p.vx, p.vz);
    if (sp > 0) { const ns = Math.max(0, sp - (p.standing ? 3 : 2.6) * dt); p.vx *= ns / sp; p.vz *= ns / sp; }
    if (!p.standing && p.tilt < Math.PI / 2) { p.tiltV += 22 * dt; p.tilt = Math.min(Math.PI / 2, p.tilt + p.tiltV * dt); }
    if (Math.abs(p.x) > W / 2 + 0.04 || p.z < PIT) { p.dropped = true; p.standing = false; if (!p.tiltV) { p.dx = 0; p.dz = -1; } }
  }
  if (ball.rolling && !ball.gutter) {
    for (const p of pins) if (p.active && !p.dropped) {
      const hit = collide(ball, p, BR, pinR(p), MB, MP, 0.55);
      if (hit) { p.vx += (Math.random() - 0.5) * 0.3 * hit; clack(hit); }
    }
  }
  for (let i = 0; i < pins.length; i++) {
    const a = pins[i]; if (!a.active || a.dropped) continue;
    for (let k = i + 1; k < pins.length; k++) {
      const b = pins[k]; if (!b.active || b.dropped) continue;
      const hit = collide(a, b, pinR(a), pinR(b), MP, MP, 0.6);
      if (hit > 0.3) clack(hit * 0.6);

  for (const p of pins) if (p.active && p.standing && Math.hypot(p.vx, p.vz) > 0.18) knock(p);

function newGame(data) {

  cur = data && data.cur != null ? data.cur : 0;
  rack(data && data.standing);
  resetBall();

}

function scores() {
  const rolls = frames.flat(), cum = []; let i = 0, total = 0;
  for (let f = 0; f < 10; f++) {
    const r = frames[f];
    if (f < 9) {
      if (!r.length) break;
      if (r[0] === 10) { if (rolls[i + 1] == null || rolls[i + 2] == null) break; total += 10 + rolls[i + 1] + rolls[i + 2]; i += 1; }
      else { if (r.length < 2) break; if (r[0] + r[1] === 10) { if (rolls[i + 2] == null) break; total += 10 + rolls[i + 2]; } else total += r[0] + r[1]; i += 2; }
    } else {

}
const tenthDone = () => { const r = frames[9]; return r.length === 3 || (r.length === 2 && r[0] + r[1] < 10); };
const d = n => n === 0 ? "-" : String(n);
function marks(f) {

  if (f < 9) {
    if (r[0] === 10) return ["", "X"];
    return [r[0] == null ? "" : d(r[0]), r[1] == null ? "" : (r[0] + r[1] === 10 ? "/" : d(r[1]))];
  }

  if (a != null) m[0] = a === 10 ? "X" : d(a);
  if (b != null) m[1] = a === 10 ? (b === 10 ? "X" : d(b)) : (a + b === 10 ? "/" : d(b));
  if (c != null) m[2] = (a === 10 && b === 10) || (a !== 10 && a + b === 10) ? (c === 10 ? "X" : d(c)) : (b + c === 10 ? "/" : d(c));

}
function renderSheet() {
  const cum = scores(), el = document.getElementById("sheet");
  el.innerHTML = frames.map((_, f) => {
    const now = phase !== "over" && f === cur;
    return `<div class="fr${now ? " now" : ""}"><span class="n">${f + 1}</span><span class="rolls">${marks(f).map(m => `<i class="${m === "X" || m === "/" ? "x" : ""}">${m}</i>`).join("")}</span><span class="cum">${cum[f] ?? ""}</span></div>`;
  }).join("");

  document.getElementById("status").textContent = phase === "over" ? "Game over" : `Frame ${cur + 1} · Ball ${frames[cur].length + 1}`;
  const nowEl = el.querySelector(".now"); if (nowEl) nowEl.scrollIntoView({ block: "nearest", inline: "nearest" });

function finishRoll() {
  const knocked = standingAtThrow - standingCount();
  const r = frames[cur]; r.push(knocked);
  let reset = false, next = false;
  if (cur < 9) {
    if (r.length === 1 && knocked === 10) { toast("<em>Strike</em>"); next = reset = true; }
    else if (r.length === 2) { if (r[0] + r[1] === 10) toast("Spare"); else if (r[0] + r[1] === 0) toast("Gutter"); next = reset = true; }
    else if (ball.gutter && knocked === 0) toast("Gutter");
  } else {
    const fresh = r.length === 1 || (r.length === 2 && (r[0] === 10 && r[1] === 10 || r[0] + r[1] === 10 && r[0] !== 10));
    if (knocked === 10 && standingAtThrow === 10) toast("<em>Strike</em>");
    else if (knocked > 0 && knocked === standingAtThrow && !fresh) toast("Spare");

    if (!p.active) continue;
    if (p.dropped) { p.y = Math.max(-0.6, p.y - 2.5 * dt); if (p.tilt < Math.PI / 2) p.tilt = Math.min(Math.PI / 2, p.tilt + 6 * dt); }
    p.grp.position.set(p.x, p.y + Math.sin(p.tilt) * 0.045, p.z);
    axis.set(p.dz, 0, -p.dx); p.grp.quaternion.setFromAxisAngle(axis, p.tilt);
  }
  guideMat.opacity += ((phase === "aim" ? 0.35 : 0) - guideMat.opacity) * Math.min(1, dt * 8);
  guide.position.set(ball.x, 0.002, ball.z - 3.2);

  const narrow = innerWidth / innerHeight < 0.8;
  if (phase === "aim" || phase === "over") {
    camPos.set(ball.x * 0.35, narrow ? 0.95 : 0.75, narrow ? 2.6 : 2.0);
    look.set(0, narrow ? -0.1 : 0.05, -8);
  } else {
    const z = Math.max(ball.z + 1.9, Z0 + 4.2);
    camPos.set(ball.x * 0.2, ball.z > -8 ? 0.7 : 0.85, z);
    look.set(0, 0.05, Math.min(ball.z - 6, Z0));
  }
  const k = Math.min(1, dt * (phase === "aim" ? 6 : 3.5));
  camera.position.lerp(camPos, k);
  camera.userData.look = (camera.userData.look || look.clone()).lerp(look, k);
  camera.lookAt(camera.userData.look);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

window.claude?.hot?.snapshot?.(() => ({ frames, cur, standing: pins.map(p => p.active && p.standing) }));
const start = data => { newGame(data && data.frames ? data : null); requestAnimationFrame(frame); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
